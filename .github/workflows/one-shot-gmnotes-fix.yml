name: One-shot populate script GMNotes
on:
  push:
    paths:
      - '.github/workflows/one-shot-gmnotes-fix.yml'
      - 'tools/one_shot_gmnotes_fix.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/one_shot_gmnotes_fix.py
      - name: Validate JSON
        run: python -m json.tool "JSON/Mage Knight Highly Scripted.json" > /dev/null
      - name: Commit JSON metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "JSON/Mage Knight Highly Scripted.json" tools/gmnotes_fix_summary.json
          git diff --cached --quiet || git commit -m "Add stable GMNotes for scripted objects"
          git push
