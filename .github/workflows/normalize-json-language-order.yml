name: One-shot normalize JSON language order

on:
  push:
    paths:
      - ".github/workflows/normalize-json-language-order.yml"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize translated object text
        shell: python
        run: |
          import json
          import re
          from pathlib import Path

          path = Path("JSON/Mage Knight Highly Scripted.json")
          raw = path.read_text(encoding="utf-8")
          data = json.loads(raw)

          canonical = ["en", "it", "ru", "zh-tw", "zh-cn", "ko", "es", "fr", "pt-br", "de"]
          fields = {"Nickname", "Description", "Text"}
          tag_re = re.compile(r"\{(en|it|ru|zh-tw|zh-cn|ko|es|fr|pt-br|de)\}")
          replacements = {}
          changed_values = 0

          def reorder(value):
              matches = list(tag_re.finditer(value))
              if len(matches) != 10:
                  raise RuntimeError(f"Expected 10 language tags, found {len(matches)} in: {value[:160]!r}")
              parts = {}
              prefix = value[:matches[0].start()]
              for i, match in enumerate(matches):
                  start = match.end()
                  end = matches[i + 1].start() if i + 1 < len(matches) else len(value)
                  parts[match.group(1)] = value[start:end]
              if set(parts) != set(canonical):
                  raise RuntimeError(f"Unexpected language set in: {value[:160]!r}")
              return prefix + "".join(f"{{{lang}}}{parts[lang]}" for lang in canonical)

          def walk(value, key=None):
              global changed_values
              if isinstance(value, str):
                  if key in fields and "{it}" in value:
                      updated = reorder(value)
                      if updated != value:
                          replacements[value] = updated
                          changed_values += 1
                  return
              if isinstance(value, list):
                  for item in value:
                      walk(item, key)
                  return
              if isinstance(value, dict):
                  for child_key, child_value in value.items():
                      if child_key in {"LuaScript", "LuaScriptState"}:
                          continue
                      walk(child_value, child_key)

          walk(data)

          updated_raw = raw
          token_matches = 0
          for old, new in replacements.items():
              old_token = json.dumps(old, ensure_ascii=False)
              new_token = json.dumps(new, ensure_ascii=False)
              count = updated_raw.count(old_token)
              if count == 0:
                  raise RuntimeError(f"Could not locate raw JSON token for: {old[:160]!r}")
              token_matches += count
              updated_raw = updated_raw.replace(old_token, new_token)

          if token_matches != changed_values:
              raise RuntimeError(f"Replacement mismatch: {token_matches} tokens for {changed_values} values")

          verified = json.loads(updated_raw)
          checked = 0
          bad = 0

          def verify(value, key=None):
              global checked, bad
              if isinstance(value, str):
                  if key in fields and "{it}" in value:
                      checked += 1
                      tags = [m.group(1) for m in tag_re.finditer(value)]
                      if tags != canonical:
                          bad += 1
                  return
              if isinstance(value, list):
                  for item in value:
                      verify(item, key)
                  return
              if isinstance(value, dict):
                  for child_key, child_value in value.items():
                      if child_key in {"LuaScript", "LuaScriptState"}:
                          continue
                      verify(child_value, child_key)

          verify(verified)
          if bad or checked != changed_values:
              raise RuntimeError(f"Verification failed: checked={checked}, changed={changed_values}, bad={bad}")

          path.write_bytes(updated_raw.encode("utf-8"))
          print(f"Normalized {changed_values} translated object-text values.")

      - name: Commit normalized JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "JSON/Mage Knight Highly Scripted.json"
          if git diff --cached --quiet; then
            echo "No JSON changes required."
          else
            git commit -m "Normalize JSON translation language order"
            git push origin HEAD:main
          fi
