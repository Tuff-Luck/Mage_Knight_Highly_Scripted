name: Complete shared helper extraction

on:
  push:
    branches:
      - modular-refactor
    paths:
      - .github/workflows/audit-shared.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-refactor
      - name: Move generic cross-module helpers into Shared
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          shared_path=Path('src/Shared.lua')
          playing_path=Path('src/PlayingGame.lua')
          setup_path=Path('src/SetupGame.lua')

          shared=shared_path.read_text(encoding='utf-8').rstrip()+'\n'
          playing=playing_path.read_text(encoding='utf-8')
          setup=setup_path.read_text(encoding='utf-8')

          def move_block(text,start_marker,end_marker,label):
              assert text.count(start_marker)==1, f'{label}: start marker count is {text.count(start_marker)}'
              start=text.index(start_marker)
              end=text.index(end_marker,start)
              block=text[start:end].rstrip()+'\n'
              return text[:start]+text[end:], block

          playing, position_block=move_block(
              playing,
              '--work out which color hand has the current turns mage',
              '--Tactic Showing and Hiding',
              'positionToColor')

          playing, rewind_block=move_block(
              playing,
              '--Short scripted transactions can span several delayed/physics callbacks.',
              '--Compatibility names for the three automated-player systems.',
              'rewind transactions')

          playing, map_block=move_block(
              playing,
              '--used to workout the offset for each hex on a terrain tile',
              '--Avatar-location scans repeatedly inspect the current hex plus its six neighbours.',
              'terrain geometry')

          playing, legal_block=move_block(
              playing,
              '--checks the clicking player matches the current turn',
              '--Add Icons to players Avatar and Rampaging Monsters',
              'legalPlayerCheck')

          setup, card_block=move_block(
              setup,
              '--Card identity helpers. Object Nicknames are display/search text and may be translated,',
              '--The printed player board has six native Unit columns.',
              'card identity')

          additions=[
              ('Turn / seat helpers',position_block),
              ('Rewind transaction helpers',rewind_block),
              ('Map geometry helpers',map_block),
              ('Player permission helpers',legal_block),
              ('Stable card identity helpers',card_block),
          ]
          for title,block in additions:
              shared += f'\n-- {title}\n' + block

          shared_path.write_text(shared,encoding='utf-8')
          playing_path.write_text(playing,encoding='utf-8')
          setup_path.write_text(setup,encoding='utf-8')

          moved=[
              'positionToColor','rewindTransactionOwnerActive','rewindTransactionStart',
              'rewindTransactionFinish','rewindTransactionForceRelease','angleToXY',
              'terrainHexBearing','terrainHexAtPosition','legalPlayerCheck','gameCardType','isTacticCard'
          ]
          texts={
              'Shared':shared_path.read_text(encoding='utf-8'),
              'SetupInterface':Path('src/SetupInterface.lua').read_text(encoding='utf-8'),
              'SetupGame':setup_path.read_text(encoding='utf-8'),
              'PlayingGame':playing_path.read_text(encoding='utf-8'),
          }
          for name in moved:
              pat=re.compile(r'^function\s+'+re.escape(name)+r'\s*\(',re.M)
              owners=[module for module,text in texts.items() if pat.search(text)]
              assert owners==['Shared'], f'{name} definitions after move: {owners}'

          definitions={}
          def_re=re.compile(r'^function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(',re.M)
          for module,text in texts.items():
              for name in def_re.findall(text): definitions.setdefault(name,[]).append(module)
          duplicates={name:owners for name,owners in definitions.items() if len(owners)>1}
          assert not duplicates, f'duplicate global function definitions: {duplicates}'

          entry=Path('.tts/objects/Global.lua').read_text(encoding='utf-8')
          expected=['require("Data")','require("Shared")','require("SetupInterface")','require("SetupGame")','require("PlayingGame")']
          positions=[entry.index(item) for item in expected]
          assert positions==sorted(positions), 'Global require order is wrong'
          assert all(entry.count(item)==1 for item in expected), 'Global requires are not unique'
          print('Shared helper extraction validated.')
          print('Moved:', ', '.join(moved))
          PY
      - name: Commit completed Shared module and remove audit workflow
        shell: bash
        run: |
          rm .github/workflows/audit-shared.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Shared.lua src/PlayingGame.lua src/SetupGame.lua .github/workflows/audit-shared.yml
          git diff --cached --check
          git commit -m "Complete shared Global helper extraction"
          git push origin HEAD:modular-refactor
