name: Audit shared helpers

on:
  push:
    branches:
      - modular-refactor
    paths:
      - .github/workflows/audit-shared.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-refactor
      - name: Locate shared helper candidates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          names = {
              'angleToXY','positionToColor','legalPlayerCheck','terrainHexAtPosition',
              'rewindTransactionStart','rewindTransactionFinish','rewindTransactionOwnerActive',
              'tableCopy','gameCardType','isTacticCard','takeManaCrystal','shieldLocation',
              'mageKnightAvatarPosition','avatarHexIdentity','straightenCrooked','dayNight'
          }
          for p in [Path('src/SetupInterface.lua'),Path('src/SetupGame.lua'),Path('src/PlayingGame.lua'),Path('src/Shared.lua')]:
              lines=p.read_text(encoding='utf-8').splitlines()
              for i,line in enumerate(lines,1):
                  m=re.match(r'^function\s+([A-Za-z_][A-Za-z0-9_]*)\s*\(', line)
                  if m and m.group(1) in names:
                      print(f'{p}:{i}:{m.group(1)}')
          PY
