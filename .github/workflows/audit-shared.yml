name: Audit shared helpers

on:
  push:
    branches:
      - modular-refactor
    paths:
      - .github/workflows/audit-shared.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: modular-refactor
      - name: Show shared helper candidates
        shell: bash
        run: |
          echo '=== Playing 1650-1705 ==='
          nl -ba src/PlayingGame.lua | sed -n '1650,1705p'
          echo '=== Playing 2425-2525 ==='
          nl -ba src/PlayingGame.lua | sed -n '2425,2525p'
          echo '=== Playing 10765-10845 ==='
          nl -ba src/PlayingGame.lua | sed -n '10765,10845p'
          echo '=== Playing 15135-15175 ==='
          nl -ba src/PlayingGame.lua | sed -n '15135,15175p'
          echo '=== Playing 27145-27225 ==='
          nl -ba src/PlayingGame.lua | sed -n '27145,27225p'
          echo '=== SetupGame 7670-7700 ==='
          nl -ba src/SetupGame.lua | sed -n '7670,7700p'
