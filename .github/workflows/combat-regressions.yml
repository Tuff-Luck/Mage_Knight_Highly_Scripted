name: Combat calculator Lua regressions

on:
  push:
    branches:
      - Main-WIP
    paths:
      - '.github/workflows/combat-regressions.yml'
      - 'src/PlayingGame/PlayerBoard/CardRecognition.lua'
      - 'src/PlayingGame/UIAssets.lua'
      - 'src/PlayingGame/AttackAssignments.lua'
      - 'src/PlayingGame/UI.lua'
      - 'src/PlayingGame/PlayerBoard/CardFlow.lua'
      - 'tools/test-combat-wound-application.lua'
      - 'tools/test-combat-target-and-commit.lua'
      - 'tools/test-combat-wounded-attack.lua'
      - 'tools/test-red-spells.lua'
      - 'tools/test-card-option-move-targeting.lua'
      - 'tools/test-fixed-combat-card-ui.lua'
      - 'tools/test-card-option-drop-stability.lua'
      - 'tools/test-combat-move-default-target.lua'
      - 'tools/test-cumbersome-move-target-cancel.lua'
      - 'tools/test-ambush-dual-target.lua'
      - 'tools/test-combat-enemy-drop-target-lock.lua'
      - 'tools/test-resource-tracker-pool-integrity.lua'

permissions:
  contents: read

jobs:
  combat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Lua 5.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
      - name: Combat wound and hand-discard tests
        run: lua5.2 tools/test-combat-wound-application.lua
      - name: Knockout, Paralysis, and Attack eligibility tests
        run: lua5.2 tools/test-combat-wounded-attack.lua
      - name: Targeting permissions and Damage confirmation tests
        run: lua5.2 tools/test-combat-target-and-commit.lua
      - name: Burning Shield and Exploding Shield tests
        run: lua5.2 tools/test-red-spells.lua
      - name: Card options remain stable during drag and recover after late TTS UI clears
        run: |
          lua5.2 tools/test-fixed-combat-card-ui.lua
          lua5.2 tools/test-card-option-drop-stability.lua
      - name: Move options and cancelling Cumbersome arrows
        run: |
          lua5.2 tools/test-card-option-move-targeting.lua
          lua5.2 tools/test-combat-move-default-target.lua
          lua5.2 tools/test-cumbersome-move-target-cancel.lua
      - name: Ambush links and enemy drop target locks
        run: |
          lua5.2 tools/test-ambush-dual-target.lua
          lua5.2 tools/test-combat-enemy-drop-target-lock.lua
      - name: Influence scoring, conversion pools and split-arrow integrity
        run: lua5.2 tools/test-resource-tracker-pool-integrity.lua
