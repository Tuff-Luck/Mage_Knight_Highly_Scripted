name: Lua 5.2 validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install Lua 5.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
      - name: Validate project structure and Lua
        shell: pwsh
        run: ./tools/validate-project.ps1 -RequireLua52
      - name: Core runtime regression tests
        run: lua5.2 tools/test-core-invariants.lua
      - name: Krang skill regression tests
        run: lua5.2 tools/test-krang-skills.lua
      - name: Arythea and shared Motivation regression tests
        run: lua5.2 tools/test-arythea-skills.lua
      - name: Combat effect button regression tests
        run: lua5.2 tools/test-combat-effect-buttons.lua
      - name: Red Spell regression tests
        run: lua5.2 tools/test-red-spells.lua
      - name: Blue Spell regression tests
        run: lua5.2 tools/test-blue-spells.lua
      - name: Call Offer browser regression tests
        run: lua5.2 tools/test-call-offer.lua
      - name: Play Area Unit scale regression tests
        run: lua5.2 tools/test-play-area-scale.lua
      - name: Play Area crystal animation regression tests
        run: lua5.2 tools/test-play-area-crystal-animation.lua
      - name: Norowas skill regression tests
        run: lua5.2 tools/test-norowas-skills.lua
      - name: Braevalar skill regression tests
        run: lua5.2 tools/test-braevalar-skills.lua
      - name: Check commit whitespace
        run: git diff --check HEAD^

  convert-rules:
    if: github.ref_name == 'rules-text-conversion-temp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install PDF text and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ocrmypdf tesseract-ocr tesseract-ocr-eng
      - name: Convert rule PDFs
        run: python3 tools/convert-rule-pdfs.py
      - name: Commit generated text files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/AI-Text
          if ! git diff --cached --quiet; then
            git commit -m "Generate AI-readable text versions of rule PDFs"
            git push
          fi
