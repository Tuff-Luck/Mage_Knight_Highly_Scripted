name: Lua 5.2 validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install Lua 5.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
      - name: Validate project structure and Lua
        shell: pwsh
        run: ./tools/validate-project.ps1 -RequireLua52
      - name: Check commit whitespace
        run: git diff --check HEAD^
