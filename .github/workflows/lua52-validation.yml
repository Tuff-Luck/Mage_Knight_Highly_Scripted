name: Lua 5.2 validation

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Install Lua 5.2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.2
      - name: Validate project structure and Lua
        shell: pwsh
        run: ./tools/validate-project.ps1 -RequireLua52
      - name: Resource tracker OFF/restart regression tests
        run: lua5.2 tools/test-resource-tracker-toggle.lua
      - name: Combat calculator regression tests
        run: lua5.2 tools/test-combat-calculator.lua
      - name: Combat targeting and damage lifecycle regression tests
        run: lua5.2 tools/test-combat-targeting.lua
      - name: Mage Knight selection regression tests
        run: lua5.2 tools/test-player-chosen.lua
      - name: TTS object lifetime regression tests
        run: lua5.2 tools/test-object-lifetime.lua
      - name: Fame and Reputation commit regression tests
        run: lua5.2 tools/test-fame-reputation.lua
      - name: Scenario disc grid regression tests
        run: lua5.2 tools/test-scenario-disc-grid.lua
      - name: City card relocation regression tests
        run: lua5.2 tools/test-city-card-relocation.lua
      - name: Crowded-map spatial performance regression tests
        run: lua5.2 tools/test-map-performance.lua
      - name: Check commit whitespace
        run: git diff --check HEAD^

  convert-rules:
    if: github.ref_name == 'rules-text-conversion-temp'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Install PDF text and OCR tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils ocrmypdf tesseract-ocr tesseract-ocr-eng
      - name: Convert rule PDFs
        run: python3 tools/convert-rule-pdfs.py
      - name: Commit generated text files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Rules/AI-Text
          if ! git diff --cached --quiet; then
            git commit -m "Generate AI-readable text versions of rule PDFs"
            git push
          fi
