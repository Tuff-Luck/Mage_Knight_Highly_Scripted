name: One-shot virgin gStates cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-clean-virgin-gstates.yml"

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Strip virgin gStates residue
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          path = Path("JSON/Mage Knight Highly Scripted.json")
          text = path.read_text(encoding="utf-8")
          root = json.loads(text)
          state = json.loads(root["LuaScriptState"])
          g = state["gStates"]

          remove = [
              "apocalypseHereNextHorseman",
              "apocalypseQuestAreaZoneGUID",
              "apocalypseQuestGoblinEnemies",
              "apocalypseQuestScoringChoiceLocked",
              "apocalypseQuestScoringDisabled",
              "competitiveSkillReminders",
              "coopAssaultDice",
              "coopCompSkillActivation",
              "dummyAllSkills",
              "exploreButtons",
              "hexMap",
              "horsemenDefeatedBy",
              "puppetMasterPuppets",
              "shadesOfTezlaPugs",
              "tomeSkillSwapPending",
              "useApocalypseTerrain",
              "zigguratPyramidUI",
              "setupUI",
              "setupScenarioState",
              "heroChallengeReservedSkills",
              "mirrorSource",
              "originalChoiceMageKnights",
              "startingHigherLevelCrystal",
              "volkareUnitCrystals",
              "cityLevels",
              "diceNeeded",
              "rounds",
              "totalUnitCount",
              "dayRound",
              "help",
          ]

          before = len(g)
          removed = []
          for key in remove:
              if key in g:
                  removed.append(key)
                  del g[key]

          new_state = json.dumps(state, ensure_ascii=False, separators=(",", ":"))
          pattern = re.compile(r'("LuaScriptState"\s*:\s*)("(?:\\.|[^"\\])*")', re.S)
          match = pattern.search(text)
          if not match:
              raise RuntimeError("Could not locate top-level LuaScriptState")

          replacement = json.dumps(new_state, ensure_ascii=False)
          updated = text[:match.start(2)] + replacement + text[match.end(2):]

          check_root = json.loads(updated)
          check_state = json.loads(check_root["LuaScriptState"])
          if len(check_state["gStates"]) != len(g):
              raise RuntimeError("gStates validation count mismatch")
          for key in removed:
              if key in check_state["gStates"]:
                  raise RuntimeError(f"{key} still present after rewrite")

          path.write_text(updated, encoding="utf-8")
          print(f"gStates: {before} -> {len(g)} fields")
          print("Removed:", ", ".join(removed))
          print(f"LuaScriptState: {len(root['LuaScriptState'])} -> {len(new_state)} chars")
          PY

      - name: Commit cleaned virgin save
        shell: bash
        run: |
          if git diff --quiet -- "JSON/Mage Knight Highly Scripted.json"; then
            echo "No JSON changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "JSON/Mage Knight Highly Scripted.json"
          git commit -m "Clean virgin gStates save data"
          git push origin HEAD:main
